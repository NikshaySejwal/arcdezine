<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nishawe Furniture Collection | Arcdezine Delhi NCR</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="images/logo/logo2.jpg" type="image/png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    .products-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: 2rem;
    }
    .product-card {
        background-color: white;
        border-radius: 1.5rem; 
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        transition: all 0.3s ease;
        overflow: hidden;
    }
    .product-card:hover {
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        transform: scale(1.02);
    }
    .product-image img {
        width: 100%;
        height: 320px;
        object-fit: cover;
    }
    .product-content {
        padding: 1.5rem;
    }
    .product-content h3 {
        font-size: 1.5rem; 
        font-weight: 600;
    }
    .product-content p {
        margin-top: 0.5rem;
        color: var(--charcoal-light);
    }
    .filter-btn {
        padding: 0.75rem 1.5rem;
        border-radius: 9999px; 
        font-weight: 500;
        transition: all 0.3s ease;
        background-color: white;
        border: 1px solid var(--gold);
        color: var(--gold);
    }
    .filter-btn.active {
        background-color: var(--gold);
        color: white;
    }
    .filter-btn:hover {
        background-color: var(--gold);
        color: white;
    }
  </style>
</head>
<body class="bg-cream text-charcoal">

  <header class="glass-nav fixed w-full z-50">

        <a href="index.html" class="flex-shrink-0">
          <img src="images/logo/logo3.jpg" alt="Arcdezine Logo" class="h-10 w-auto logo-img">
        </a>
        <div class="hidden md:flex items-center space-x-8">
          <a href="index.html" class="nav-link">Home</a>
          <a href="nishawe.html" class="nav-link">Nishawe (Furniture)</a>
          <a href="interior.html" class="nav-link">Interior Catalogue</a>
          <a href="project.html" class="nav-link">Projects</a>

            <span>WhatsApp</span>

        </div>
        <div class="md:hidden flex items-center">
          <button id="hamburgerMenu" class="text-charcoal focus:outline-none">
              <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m4 6h16"></path></svg>
          </button>
        </div>
      </nav>
      <div id="mobileNavMenu" class="md:hidden hidden bg-white py-2">
        <a href="index.html" class="block px-4 py-2 text-charcoal hover:bg-cream">Home</a>
        <a href="nishawe.html" class="block px-4 py-2 text-charcoal hover:bg-cream">Nishawe (Furniture)</a>
        <a href="interior.html" class="block px-4 py-2 text-charcoal hover:bg-cream">Interior Catalogue</a>

      </div>
    </div>

  <main class="pt-14">
    <section class="relative h-[80vh] text-white">
        <video 
          autoplay 
          loop 
          muted 
          playsinline 
          class="absolute inset-0 w-full h-full object-cover"
          poster="background_images/pexels-kamo11235-667838.jpg"
          id="hero-video"
        >
            <source src="https://videos.pexels.com/video-files/3854133/3854133-hd_1920_1080_25fps.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        <div class="absolute inset-0 bg-black opacity-50"></div>
        <div class="relative z-10 flex flex-col items-center justify-center h-full text-center p-4">
            <h1 class="text-5xl md:text-6xl font-bold">Nishawe Collection</h1>
            <p class="mt-4 text-xl md:text-2xl">Bespoke Furniture, Crafted In-House.</p>
        </div>
    </section>

    <section id="products" class="py-16 bg-cream">
        <div class="container mx-auto px-4">
            <div class="main-filters text-center mb-12">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="chair">Chairs</button>
                <button class="filter-btn" data-filter="sofa">Sofas</button>
                <button class="filter-btn" data-filter="bed">Beds</button>
                <button class="filter-btn" data-filter="cabinet">Cabinets</button>
            </div>

            <div class="sub-filters text-center mb-12">
                <div data-parent-filter="chair" class="hidden flex flex-wrap justify-center gap-4">
                    <button class="filter-btn" data-filter="dining-chair">Dining Chairs</button>
                    <button class="filter-btn" data-filter="arm-chair">Arm Chairs</button>
                    <button class="filter-btn" data-filter="puffs">Puffs</button>
                    <button class="filter-btn" data-filter="stool">Stools</button>
                </div>
                <div data-parent-filter="sofa" class="hidden flex flex-wrap justify-center gap-4">
                    <button class="filter-btn" data-filter="sectional">Sectional</button>
                    <button class="filter-btn" data-filter="recliner">Recliner</button>
                    <button class="filter-btn" data-filter="loveseat">Loveseat</button>
                    <button class="filter-btn" data-filter="chaise">Chaise</button>
                </div>
                <div data-parent-filter="bed" class="hidden flex flex-wrap justify-center gap-4">
                    <button class="filter-btn" data-filter="platform-bed">Platform Beds</button>
                    <button class="filter-btn" data-filter="storage-bed">Storage Beds</button>
                    <button class="filter-btn" data-filter="day-bed">Day Beds</button>
                </div>
                <div data-parent-filter="cabinet" class="hidden flex flex-wrap justify-center gap-4">
                    <button class="filter-btn" data-filter="tv">TV Cabinets</button>
                    <button class="filter-btn" data-filter="side">Sideboards</button>
                    <button class="filter-btn" data-filter="tall">Tall Cabinets</button>
                    <button class="filter-btn" data-filter="other-cabinets">Other Cabinets</button>
                    <button class="filter-btn" data-filter="puja">Puja Units</button>
                </div>
            </div>

            <div class="products-grid js-products-grid">
                <!-- Products will be dynamically inserted here -->
            </div>
        </div>
    </section>
  </main>

  <footer class="bg-charcoal text-cream py-8">
